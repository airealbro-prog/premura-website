<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="assets/premura-logo.png">
<link rel="apple-touch-icon" href="assets/premura-logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Testimonials · Premura Sales</title>
<meta name="description" content="Internal: grab any client's testimonial link and send it to a lead.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:ital,wght@0,700;0,800;1,700;1,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sales-testimonials.css">
</head>
<body>

<header class="st-head">
  <div class="st-wrap">
    <span class="st-eyebrow">Premura · Sales tool</span>
    <h1 class="st-h1">Client <span class="st-u">testimonials</span></h1>
    <p class="st-sub">Copy any client's link and send it to your lead — it opens a clean page with just that testimonial. Pick their state for local proof.</p>
  </div>
</header>

<!-- State jump index (all 50 + DC). Active states link to their group; empty ones are dimmed. -->
<nav class="st-index" aria-label="Jump to a state"><div class="st-wrap"><div class="st-index-row" data-state-index></div></div></nav>

<main class="st-wrap">
  <div data-results></div>
</main>

<footer class="st-foot">
  <div>Internal sales tool · not indexed. Questions? <a href="mailto:support@premura.org">support@premura.org</a></div>
  <div style="margin-top:8px;">© 2026 Premura Corp.</div>
</footer>

<script src="sales-data.js"></script>
<script>
(function(){
  var esc=ST.esc, slug=ST.slug;
  // robust copy: Clipboard API, else execCommand, else select-the-link
  function execCopy(t){try{var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:-1000px;left:-1000px;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();var okc=document.execCommand&&document.execCommand('copy');document.body.removeChild(ta);return !!okc;}catch(e){return false;}}
  function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t).then(function(){return true;},function(){return execCopy(t);});}return Promise.resolve(execCopy(t));}
  function selectNode(el){try{var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);return true;}catch(e){return false;}}

  function card(c){
    var el=document.createElement('article');el.className='st-card';el.id=c.id;
    var vid=document.createElement('div');vid.className='st-video';vid.appendChild(ST.facade(c));
    el.appendChild(vid);

    var body=document.createElement('div');body.className='st-body';
    var nm=c.name+(c.industry?' <span class="st-ind">· '+esc(c.industry)+'</span>':'');
    var loc=ST.loc(c);
    body.innerHTML=
      "<div class='st-name'>"+nm+"</div>"+
      (loc?"<div class='st-loc'>📍 "+esc(loc)+"</div>":"")+
      "<div class='st-stat'>"+esc(c.stat)+"</div>"+
      (c.quote
        ? "<blockquote class='st-quote'>“"+esc(c.quote)+"”</blockquote>"
        : "<div class='st-quote st-quote-todo'>Quote to add — paste "+esc(c.name.split(' ')[0])+"'s words here</div>");

    var link=ST.shareLink(c.id);
    var row=document.createElement('div');row.className='st-actions';
    var open=document.createElement('a');open.className='st-open';open.href=link;open.target='_blank';open.rel='noopener';open.textContent='Open ↗';
    var btn=document.createElement('button');btn.type='button';btn.className='st-copy';
    btn.innerHTML="<span class='st-copy-ic'>🔗</span> Copy link to send";
    btn.addEventListener('click',function(){
      var orig="<span class='st-copy-ic'>🔗</span> Copy link to send";
      function flash(txt,cls){btn.classList.add(cls);btn.innerHTML=txt;setTimeout(function(){btn.classList.remove(cls);btn.innerHTML=orig;},2400);}
      copyText(link).then(function(done){
        if(done){flash("✓ Copied — paste it to your lead",'is-copied');}
        else{selectNode(small);flash("Link selected — press Ctrl+C",'is-copied');}
      });
    });
    row.appendChild(btn);row.appendChild(open);
    body.appendChild(row);
    var small=document.createElement('div');small.className='st-linkline';small.textContent=link;body.appendChild(small);

    el.appendChild(body);
    return el;
  }

  // group clients by state (TBD -> "Unassigned")
  var byState={};
  ST_DATA.forEach(function(c){var k=(c.state&&c.state.toUpperCase()!=='TBD')?c.state:'__TBD__';(byState[k]=byState[k]||[]).push(c);});
  var present={};Object.keys(byState).forEach(function(k){if(k!=='__TBD__')present[k.toLowerCase()]=true;});

  // state index
  var idx=document.querySelector('[data-state-index]');
  ST_STATES.forEach(function(s){
    var has=present[s.toLowerCase()];
    var a=document.createElement('a');a.className='st-pill'+(has?'':' is-empty');
    a.textContent=s;
    if(has){a.href='#state-'+slug(s);}else{a.setAttribute('aria-disabled','true');a.title='No testimonials yet';}
    idx.appendChild(a);
  });

  // results — assigned states alphabetically, then Unassigned
  var results=document.querySelector('[data-results]');
  var assigned=Object.keys(byState).filter(function(k){return k!=='__TBD__';}).sort();
  function group(title,id,list,note){
    var sec=document.createElement('section');sec.className='st-group';if(id)sec.id=id;
    sec.innerHTML="<h2 class='st-group-h'>"+esc(title)+" <span class='st-count'>"+list.length+"</span></h2>"+(note?"<p class='st-note'>"+note+"</p>":"");
    var grid=document.createElement('div');grid.className='st-grid';
    list.forEach(function(c){grid.appendChild(card(c));});
    sec.appendChild(grid);results.appendChild(sec);
  }
  assigned.forEach(function(st){group(st,'state-'+slug(st),byState[st]);});
  if(byState['__TBD__']){
    group('Unassigned — set each client’s state in the config','state-unassigned',byState['__TBD__'],
      'These clients don’t have a state yet. Assign one in <code>sales-data.js</code> (change <code>state:’TBD’</code> to e.g. <code>state:’Florida’</code>) and they’ll file under that state above and light up its pill.');
  }

  // arriving with a #hash still highlights that card on the directory
  function flash(){var h=location.hash.slice(1);if(!h)return;var el=document.getElementById(h);if(el){el.classList.add('is-target');el.scrollIntoView({block:'center'});}}
  window.addEventListener('hashchange',function(){document.querySelectorAll('.st-card.is-target').forEach(function(e){e.classList.remove('is-target');});flash();});
  flash();
})();
</script>

</body>
</html>
